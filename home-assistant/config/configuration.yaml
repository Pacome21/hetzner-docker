# Home Assistant utilise la pile réseau du conteneur WireGuard (réseau distant).
# mDNS / découverte automatique ne traversent en général pas le VPN : pour les
# appareils sur 192.168.1.x, configurer les intégrations avec une IP ou un hostname
# fixe (réservation DHCP côté site distant), pas uniquement la découverte.
# Test réseau : docker exec wireguard ping -c 2 <ip_lan_distant>

# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Because of Clouflare, trust the reverse proxy.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1
    - 172.23.0.0/16
