services:
  whatsupdocker:
    image: getwud/wud
    container_name: wud
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/docker/whoami:/stacks/whoami
      - /opt/docker/portainer:/stacks/portainer
      - /opt/docker/cloudflare:/stacks/cloudflare
      - /opt/docker/paperless-ngx:/stacks/paperless-ngx
    environment:
      TZ: UTC
      WUD_WATCHER_LOCAL_CRON: "0 4 * * *"
      WUD_WATCHER_LOCAL_WATCHEVENTS: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_WHOAMI_FILE: /stacks/whoami/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_WHOAMI_AUTO: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_WHOAMI_PRUNE: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_PORTAINER_FILE: /stacks/portainer/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_PORTAINER_AUTO: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_PORTAINER_PRUNE: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_CLOUDFLARED_FILE: /stacks/cloudflare/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_CLOUDFLARED_AUTO: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_CLOUDFLARED_PRUNE: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_PAPERLESS_FILE: /stacks/paperless-ngx/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_PAPERLESS_AUTO: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_PAPERLESS_PRUNE: "true"
    ports:
      - 3000:3000
    healthcheck:
      test: curl --fail http://localhost:${WUD_SERVER_PORT:-3000}/health || exit 1
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
